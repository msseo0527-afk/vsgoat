<body>

    <script>

         
    
        let 점수 = [
             {
            이름:"리오넬 메시",
            링크:"1.png",
            득표수:0}
            ,{
            이름:"히카르두 카카",
            링크:"2.png",
            득표수:0}
            ,{
            이름:"네이마르 주니오르",
            링크:"3.png",
            득표수:0}
            ,{
            이름:"앙헬 디마리아",
            링크:"4.png",
            득표수:0}
            ,{
            이름:"크리스티아누 호날두",
            링크:"5.png",
            득표수:0}
            ,{
            이름:"마이클 올리세",
            링크:"6.png",
            득표수:0}
            ,{
            이름:"케난 일디즈",
            링크:"7.png",
            득표수:0}
            
        
        ];


        let 지난대결 = [-0,-0,]     
        let 랜덤숫자 = [Math.floor(Math.random() *점수.length),Math.floor(Math.random() *점수.length)]  
        let 전체투표수 = 점수.reduce((합계, x2) => 합계 + x2.득표수, 0);
       
        
        
        function 점수를올리다(대상){
        
            점수[대상].득표수 += 1;
            전체투표수 = 점수.reduce((합계, x2) => 합계 + x2.득표수, 0);
            점수.sort((a , b) => b.득표수 - a.득표수);
            document.getElementById("사과3").innerHTML = 점수.map(x => `<p class="플레이어">${x.이름} : ${x.득표수} 표 (${Math.floor(x.득표수 / 전체투표수 * 100)}%) </p>`)
            .join("");
            대결();
            document.getElementById("포도2").innerHTML = 전체투표수
        }
        function 점수를올리다2(대상){
             
            점수[대상].득표수 += 1;
            전체투표수 = 점수.reduce((합계, x2) => 합계 + x2.득표수, 0);
            점수.sort((a , b) => b.득표수 - a.득표수);
            document.getElementById("사과3").innerHTML = 점수.map(x => `<p class="플레이어">${x.이름} : ${x.득표수} 표 (${Math.floor(x.득표수 / 전체투표수 * 100)}%) </p>`)
            .join("");
            대결();
            document.getElementById("포도2").innerHTML = 전체투표수
            
        }
        function 대결(){
            
            
            while (랜덤숫자[0]===랜덤숫자[1] || 점수[랜덤숫자[0]].이름 === 지난대결[0] || 점수[랜덤숫자[1]].이름 === 지난대결[1]){
                랜덤숫자 =[Math.floor(Math.random() *점수.length),Math.floor(Math.random() *점수.length)]
                }
            document.getElementById("이미지1").src = 점수[랜덤숫자[0]].링크
            document.getElementById("사과").innerText = 점수 [랜덤숫자[0]].이름
            document.getElementById("이미지2").src = 점수 [랜덤숫자[1]].링크
            document.getElementById("바나나").innerText = 점수 [랜덤숫자[1]].이름
            지난대결 = [점수[랜덤숫자[0]].이름 , 점수[랜덤숫자[1]].이름 ]
           
            }
        
    </script>

    @keyframes 상승 {
        0% {position: absolute; top: 50%; left: 48%; transform: translate(-50%,-50%)}

        100%{ left: 1%; opacity: 1}

    .상자1, .상자2 ,.플레이어 ,.안녕,.망고 {
